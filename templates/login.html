<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPOwork | Iniciar sesión</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/upowork-logo.svg" alt="UPOwork">
    </a>
  </header>

  <main class="login-main section-shell">
    <div class="login-heading">
      <h1>Bienvenido de nuevo</h1>
      <p>Ingresa tus credenciales para acceder a tu cuenta</p>
    </div>

    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}

    <form class="login-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <label>Correo electrónico</label>
      <input type="email" name="correo" required>

      <label>Contraseña</label>
      <input type="password" name="contrasena" required>

      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="login-helper">¿No tienes cuenta? <a href="/registro-personal">Regístrate aquí</a></p>
    <p class="login-helper"><a href="/">← Volver al inicio</a></p>
  </main>
</body>
</html>
