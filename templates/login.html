<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPOwork | Iniciar sesión</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/upowork-logo.svg" alt="UPOwork">
    </a>
  </header>

  <main class="login-main section-shell">
    <div class="login-card">
      <h1>Iniciar sesión</h1>
      <form id="login-form" class="login-form">
        <input type="hidden" name="role" value="student">
        
        <label>Correo electrónico</label>
        <input type="email" name="email" required>

        <label>Contraseña</label>
        <input type="password" name="password" required>

        <button type="submit" class="button login-button">Entrar</button>
      </form>

      <p class="login-help">¿No tienes cuenta? <a href="/registro-personal">Regístrate aquí</a></p>
      <p class="login-help"><a href="/">← Volver al inicio</a></p>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
