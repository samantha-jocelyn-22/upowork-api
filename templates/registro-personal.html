<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPOwork | Registro de personal</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/upowork-logo.svg" alt="UPOwork">
    </a>
    <a class="text-link" href="/login">Iniciar sesión</a>
  </header>

  <main class="login-main section-shell">
    <div class="login-heading">
      <p class="eyebrow">Acceso para personal autorizado</p>
      <h1>Cuenta de<br><em>personal UPOTec.</em></h1>
      <p>El código de invitación confirma que tienes permiso para gestionar vacantes y perfiles desde la universidad.</p>
    </div>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form class="login-form" action="/registro-personal" method="POST">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo institucional</label>
      <input type="email" id="email" name="email" required>

      <label for="codigo">Código de autorización</label>
      <input type="text" id="codigo" name="codigo" placeholder="Ingresa tu código" required>

      <label for="password">Contraseña (mínimo 8 caracteres)</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="button">Crear cuenta <span>→</span></button>
    </form>

    <p class="login-helper">¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>
  </main>

  <footer>
    <div class="footer-inner">
      <span>© 2026 UPOwork · UPOTec</span>
    </div>
  </footer>
</body>
</html>
