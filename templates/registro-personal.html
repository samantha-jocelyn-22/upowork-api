<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPOwork | Registro de personal</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/upowork-logo.svg" alt="UPOwork">
    </a>
    <a class="text-link" href="/login">Iniciar sesión</a>
  </header>

  <main class="login-main section-shell">
    <div class="login-heading">
      <p class="eyebrow">Acceso para personal autorizado</p>
      <h1>Cuenta de<br><em>personal UPOTec.</em></h1>
      <p>El código de invitación confirma que tienes permiso para gestionar ofertas y perfiles.</p>
    </div>

    <form class="login-form" method="post" action="/api/registro">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <label>Nombre completo</label>
      <input type="text" name="nombre" required>

      <label>Correo institucional</label>
      <input type="email" name="email" required>

      <label>Carrera</label>
      <input type="text" name="carrera" required>

      <label>Contraseña</label>
      <input type="password" name="contrasena" required>

      <button type="submit" class="btn-primary">Crear cuenta</button>
    </form>

    <p class="login-helper">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
  </main>
</body>
</html>
