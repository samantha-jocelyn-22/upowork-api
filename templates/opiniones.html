<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta y comparte opiniones sobre el servicio UPOwork.">
  <title>UPOwork | Opiniones del servicio</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="UPOwork, inicio">
      <img class="brand-logo" src="/static/upowork-logo.svg" alt="UPOwork">
    </a>
    <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="/">Inicio</a>
      <a href="/vacantes">Vacantes</a>
      <a href="/opiniones" class="active">Opiniones</a>
      <a href="/consejos">Consejos</a>
      <a href="/empresas">Empresas</a>
      <a href="/login" class="btn-outline">Iniciar sesión</a>
    </nav>
  </header>

  <main class="section-shell">
    <h1>Opiniones del servicio</h1>
    <p>Aquí irán las opiniones de los usuarios...</p>
    <a href="/" class="btn-link">← Volver al inicio</a>
  </main>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');
    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
  </script>
</body>
</html>
