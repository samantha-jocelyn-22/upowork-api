services:
  - type: web
    name: upowork
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    disk:
      name: upowork-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: UPOWORK_ENV
        value: production
      - key: UPOWORK_HTTPS
        value: "true"
      - key: UPOWORK_SECRET_KEY
        generateValue: true
      - key: UPOWORK_DATABASE
        value: /var/data/upotec.db
      - key: UPOWORK_UPLOADS
        value: /var/data/uploads
      - key: UPOWORK_ADMIN_EMAIL
        sync: false
      - key: UPOWORK_ADMIN_PASSWORD
        sync: false
      - key: UPOWORK_ADMIN_NAME
        value: Coordinación UPOwork
